description = "Mock weather MCP server exposing weather tools via the Model Context Protocol"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.9.0",
    "anthropic>=0.97.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
