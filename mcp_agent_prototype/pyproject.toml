[project]
name = "mcp-agent-prototype"
version = "0.1.0"
description = "MCP agent prototype with deferred tool loading — MCP server + Anthropic Python SDK client"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.9.0",
    "anthropic>=0.97.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
