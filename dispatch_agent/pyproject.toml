[project]
name = "dispatch-agent"
version = "0.1.0"
description = "Multi-agent research dispatcher using Claude Agent SDK Dispatch and Channels patterns for parallel web research, query decomposition, and information synthesis."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.97.0",
    "tavily-python>=0.5.0",
    "httpx>=0.27.0",
]

[project.scripts]
dispatch-agent = "dispatch_agent.main:main"

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.backends._legacy:_Backend"
