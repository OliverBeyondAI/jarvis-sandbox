[project]
name = "agents"
version = "0.1.0"
description = "Modular AI agent framework with Tavily search and URL fetching tools, built on the Claude Agent SDK."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.97.0",
    "tavily-python>=0.5.0",
    "httpx>=0.27.0",
]

[project.scripts]
agents = "agents.main:main"

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.backends._legacy:_Backend"
