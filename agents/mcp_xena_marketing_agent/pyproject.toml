[project]
name = "mcp-xena-marketing-agent"
version = "0.1.0"
description = "MCP-powered marketing agent combining Claude Agent SDK, MCP tool servers, OpenAI image generation, and Tavily research"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.97.0",
    "mcp>=1.9.0",
    "openai>=1.30.0",
    "tavily-python>=0.5.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "beautifulsoup4>=4.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21.0",
]

[project.scripts]
mcp-xena = "agents.mcp_xena_marketing_agent.main:main"

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.backends._legacy:_Backend"
