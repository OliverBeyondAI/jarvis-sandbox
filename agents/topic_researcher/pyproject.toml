[project]
name = "topic-researcher"
version = "0.1.0"
description = "A topic research agent that uses Claude Agent SDK and Tavily web search to produce structured research summaries."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "tavily-python>=0.5.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
]

[project.scripts]
topic-researcher = "agents.topic_researcher.__main__:main"

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.backends._legacy:_Backend"
