[project]
name = "claude-opus-agent-prototype"
version = "0.1.0"
description = "Claude Opus 4.6 agentic research agent with structured logging and error handling"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.97.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
search = ["tavily-python>=0.5.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
