[project]
name = "ophthoflow-prior-auth-agent"
version = "0.1.0"
description = "AI-powered ophthalmology prior authorization agent built on the Claude Agent SDK via AWS Bedrock. Automates clinical note parsing, payer requirement checks, and PA letter drafting."
requires-python = ">=3.11"
dependencies = [
    "anthropic[bedrock]>=0.97.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
ophthoflow-pa = "ophthoflow_prior_auth_agent.main:main"

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.backends._legacy:_Backend"
